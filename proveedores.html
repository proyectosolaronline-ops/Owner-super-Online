<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Proveedores — LandingKit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#0b0f1a;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;
  --accent:#059669;--accent-dim:#05966922;--accent-dark:#047857;
  --ok:#10b981;--warn:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--display:'Syne',sans-serif;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--font);outline:none}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;width:100%;max-width:380px}
.login-brand{font-family:var(--display);font-size:20px;font-weight:800;color:var(--accent);margin-bottom:4px}
.login-title{font-size:15px;color:var(--muted2);margin-bottom:24px}
.lfield{margin-bottom:14px}
.lfield label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.lfield input,.lfield textarea{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:15px}
.lfield input:focus,.lfield textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.lfield textarea{resize:vertical;min-height:60px;font-size:13px}
.lerr{font-size:13px;color:var(--danger);margin-bottom:12px;padding:10px 12px;background:#ef444411;border:1px solid #ef444433;border-radius:var(--rs);display:none}
.lbtn{width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:var(--rs);font-size:15px;font-weight:700;margin-top:4px;transition:.2s}
.lbtn:hover{background:var(--accent-dark)}
.lbtn:disabled{opacity:.5}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100vh}
#app.on{display:flex}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);height:56px;padding:0 16px;display:flex;align-items:center;gap:10px}
.tb-logo{font-family:var(--display);font-size:15px;font-weight:800;color:var(--accent)}
.tb-badge{background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--accent);white-space:nowrap}
.tb-store{font-size:12px;color:var(--muted2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:var(--rs);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px;transition:.15s;flex-shrink:0}
.ib:hover{background:var(--surface2);color:var(--text)}

/* ── CONTENT ── */
.content{flex:1;padding:16px;max-width:640px;margin:0 auto;width:100%}

/* ── BTNS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:600;transition:.15s;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark)}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border-color:#ef444433}.btn-danger:hover{background:#ef444411}
.btn-wa{background:#25d366;color:#fff}.btn-wa:hover{background:#1daa55}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-full{width:100%;justify-content:center}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat-val{font-family:var(--display);font-size:22px;font-weight:800}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:3px}
.stat-green{color:var(--ok)}
.stat-warn{color:var(--warn)}
.stat-info{color:var(--info)}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px}
.search-input{width:100%;padding:11px 14px 11px 38px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px;transition:.15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}

/* ── SUPPLIER CARDS ── */
.sup-list{display:flex;flex-direction:column;gap:10px}
.sup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s}
.sup-card:hover{border-color:var(--accent)}
.sup-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.sup-avatar{width:38px;height:38px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;font-weight:800;color:var(--accent);flex-shrink:0}
.sup-name{font-family:var(--display);font-size:15px;font-weight:700}
.sup-contact{font-size:12px;color:var(--muted2);margin-top:2px}
.sup-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sup-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted2);background:var(--surface2);border:1px solid var(--border);padding:3px 8px;border-radius:99px}
.sup-actions{display:flex;gap:6px;flex-shrink:0}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty-ico{font-size:40px;margin-bottom:12px}
.empty h3{font-family:var(--display);font-size:16px;font-weight:700;color:var(--muted2);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}

/* ── SPINNER ── */
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-big{width:32px;height:32px;border-width:3px;margin:0 auto}

/* ── OVERLAY / MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
@media(min-width:520px){.overlay{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto}
@media(min-width:520px){.modal{border-radius:20px;max-width:480px}}
.modal-hdr{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-family:var(--display);font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}

/* ── DETAIL ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.dl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.dv{font-size:14px;font-weight:500}
.dv-full{grid-column:1/-1}
.compras-list{display:flex;flex-direction:column;gap:8px}
.compra-row{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700}
.badge-pending{background:#f59e0b22;color:var(--warn);border:1px solid #f59e0b44}
.badge-confirmed{background:#10b98122;color:var(--ok);border:1px solid #10b98144}
.badge-cancelled{background:#ef444422;color:var(--danger);border:1px solid #ef444444}

/* ── CONFIRM ── */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center}
.confirm-icon{font-size:32px;margin-bottom:10px}
.confirm-title{font-family:var(--display);font-size:18px;font-weight:800;margin-bottom:8px}
.confirm-msg{font-size:13px;color:var(--muted2);line-height:1.5;margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:500;z-index:999;display:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.success{border-color:var(--ok);color:var(--ok)}
#toast.error{border-color:var(--danger);color:var(--danger)}
#toast.warn{border-color:var(--warn);color:var(--warn)}

/* ── SESSION WARN ── */
.session-warn{display:none;position:fixed;bottom:20px;right:16px;background:var(--warn);color:#000;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;z-index:90;align-items:center;gap:10px}
.session-warn.show{display:flex}
.session-warn-btn{background:rgba(0,0,0,.2);border:none;border-radius:6px;color:#000;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}

/* ── LIMIT BAR ── */
.limit-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;margin-bottom:14px;display:none;align-items:center;justify-content:space-between;gap:8px}
.limit-bar.show{display:flex}
.limit-track{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.limit-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.limit-txt{font-size:11px;color:var(--muted2);white-space:nowrap}

/* ── BOTÓN FLOTANTE VOLVER AL PANEL ── */
#btn-back-panel{
  position:fixed;bottom:80px;right:16px;z-index:88;
  background:#6366f1;color:#fff;
  border:none;border-radius:99px;
  padding:10px 16px 10px 12px;
  font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  cursor:pointer;font-family:inherit;
  transition:opacity .2s,transform .2s;white-space:nowrap;
}
#btn-back-panel:hover{opacity:.9;transform:translateY(-2px)}
#btn-back-panel svg{width:16px;height:16px;flex-shrink:0}
/* ── MONITOR INACTIVIDAD MÓDULO ── */
#mod-inactive-warn{
  display:none;position:fixed;top:0;left:0;right:0;z-index:200;
  background:#f59e0b;color:#000;
  padding:10px 16px;font-size:13px;font-weight:600;
  align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
#mod-inactive-warn.show{display:flex}
#mod-inactive-warn-btn{
  background:rgba(0,0,0,.15);border:none;border-radius:6px;
  padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
}

</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-brand">🏭 LandingKit</div>
    <div class="login-title">Módulo de Proveedores</div>
    <div class="lfield">
      <label>Código LK de acceso</label>
      <input id="l-code" placeholder="LK-..." autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="lerr" id="l-err"></div>
    <button class="lbtn" id="l-btn" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="tb-logo">🏭</div>
    <span class="tb-badge">Proveedores</span>
    <div class="tb-store" id="tb-store">Mi Tienda</div>
    <button class="ib" onclick="loadAll()" title="Actualizar">🔄</button>
    <button class="ib" onclick="confirmLogout()" title="Salir">↩</button>
  </div>

  <div class="content">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val stat-green" id="s-total">—</div><div class="stat-lbl">Proveedores</div></div>
      <div class="stat-card"><div class="stat-val stat-info"  id="s-activos">—</div><div class="stat-lbl">Con compras</div></div>
      <div class="stat-card"><div class="stat-val stat-warn"  id="s-limite">—</div><div class="stat-lbl">Límite plan</div></div>
    </div>

    <!-- Limit bar -->
    <div class="limit-bar" id="limit-bar">
      <div class="limit-txt" id="limit-txt">0 / 0 proveedores</div>
      <div class="limit-track"><div class="limit-fill" id="limit-fill" style="width:0%"></div></div>
    </div>

    <!-- Search + botón nuevo -->
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <div class="search-wrap" style="flex:1;margin-bottom:0">
        <span class="search-ico">🔍</span>
        <input class="search-input" id="search-input" placeholder="Buscar proveedor..." oninput="renderList()">
      </div>
      <button class="btn btn-primary" id="btn-nuevo" onclick="openNew()">+ Nuevo</button>
    </div>

    <!-- Lista -->
    <div id="sup-list">
      <div class="empty"><div class="spinner spinner-big"></div></div>
    </div>

  </div>
</div>

<!-- MODAL: Nuevo / Editar proveedor -->
<div class="overlay" id="overlay-form">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="form-title">Nuevo proveedor</div>
      <button class="ib" onclick="closeOverlay('overlay-form')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="lfield"><label>Nombre *</label><input id="f-name" placeholder="Proveedor S.A."/></div>
      <div class="lfield"><label>Contacto</label><input id="f-contact" placeholder="Nombre del contacto"/></div>
      <div class="lfield"><label>Teléfono / WhatsApp</label><input id="f-phone" placeholder="+52 555 000 0000" type="tel"/></div>
      <div class="lfield"><label>Email</label><input id="f-email" placeholder="contacto@proveedor.com" type="email"/></div>
      <div class="lfield"><label>Dirección</label><input id="f-address" placeholder="Calle, Ciudad"/></div>
      <div class="lfield"><label>Notas</label><textarea id="f-notes" placeholder="Condiciones de pago, días de entrega..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-full" onclick="closeOverlay('overlay-form')">Cancelar</button>
      <button class="btn btn-primary btn-full" id="btn-save" onclick="saveSupplier()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: Detalle proveedor -->
<div class="overlay" id="overlay-detail">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="detail-title">Proveedor</div>
      <button class="ib" onclick="closeOverlay('overlay-detail')">✕</button>
    </div>
    <div class="modal-body" id="detail-body">
      <div class="empty"><div class="spinner spinner-big"></div></div>
    </div>
    <div class="modal-foot" id="detail-foot"></div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="c-icon">⚠️</div>
    <div class="confirm-title" id="c-title">¿Estás seguro?</div>
    <div class="confirm-msg"   id="c-msg"></div>
    <div class="confirm-btns">
      <button class="btn btn-ghost btn-full" onclick="resolveConfirm(false)">Cancelar</button>
      <button class="btn btn-primary btn-full" id="c-ok" onclick="resolveConfirm(true)">Confirmar</button>
    </div>
  </div>
</div>

<!-- SESSION WARN -->
<div class="session-warn" id="session-warn">
  <span>⏱ Sesión expira en 2 min</span>
  <button class="session-warn-btn" onclick="extendSession()">Continuar</button>
</div>

<div id="toast"></div>

<script>
/* ─── CONFIG ─── */
const params      = new URLSearchParams(location.search);
const BACKEND     = params.get('backend')     || localStorage.getItem('ld_backend')     || 'https://script.google.com/macros/s/AKfycbwUhTHQkBhLIvF9KgP2bHpVeufIEaPCXZWo9-azz7mYrEEA79BPFCQxE68YQQxE5iw/exec';
const INV_BACKEND = params.get('inv_backend') || localStorage.getItem('ld_inv_backend') || '';
const TOKEN       = localStorage.getItem('ld_token')  || '';
const STORE_ID    = localStorage.getItem('ld_store')  || '';

let ALL_SUPPLIERS = [];
let ALL_PURCHASES = [];
let PLAN_INFO     = { maxProveedores: 0 };
let STORE_CFG     = {};
let _confirmResolve = null;

/* ─── INIT ─── */
window.addEventListener('load', async function() {
  if (TOKEN && STORE_ID) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('on');
    await loadAll();
  }
  resetInactTimer();
});

/* ─── LOGIN (si llega sin sesión) ─── */
async function doLogin() {
  const code = document.getElementById('l-code').value.trim();
  const btn  = document.getElementById('l-btn');
  const err  = document.getElementById('l-err');
  err.style.display = 'none';
  if (!code) { err.textContent = 'Pega tu código LK-...'; err.style.display = 'block'; return; }
  if (!BACKEND) { err.textContent = 'Falta URL del backend en la URL'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const res = await fetch(BACKEND, {
      method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'owner.login', accessCode: code })
    });
    const data = await res.json();
    if (!data.ok || !data.token) { err.textContent = data.error || 'Código inválido'; err.style.display = 'block'; return; }
    localStorage.setItem('ld_token',   data.token);
    localStorage.setItem('ld_store',   data.storeId);
    localStorage.setItem('ld_backend', BACKEND);
    if (INV_BACKEND) localStorage.setItem('ld_inv_backend', INV_BACKEND);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('on');
    await loadAll();
  } catch(e) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Ingresar'; }
}

/* ─── API ─── */
async function postAPI(backend, payload) {
  const res = await fetch(backend, {
    method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function api(action, data) {
  data = data || {};
  const backend = INV_BACKEND || localStorage.getItem('ld_inv_backend') || '';
  if (!backend) { toast('Falta URL del backend de inventario (inv_backend)', 'error'); return null; }
  try {
    const json = await postAPI(backend, Object.assign({ action, storeId: STORE_ID, token: TOKEN }, data));
    if (json.error) throw new Error(json.error);
    return json;
  } catch(e) { toast(e.message, 'error'); return null; }
}

async function apiMain(action, data) {
  data = data || {};
  try {
    const json = await postAPI(BACKEND, Object.assign({ action, storeId: STORE_ID, token: TOKEN }, data));
    if (json.error) throw new Error(json.error);
    return json;
  } catch(e) { toast(e.message, 'error'); return null; }
}

/* ─── LOAD ALL ─── */
async function loadAll() {
  document.getElementById('sup-list').innerHTML = '<div class="empty"><div class="spinner spinner-big"></div></div>';

  const [storeRes, planRes, supRes, purchRes] = await Promise.all([
    apiMain('store.info'),
    api('inv.plan.check'),
    api('supplier.list'),
    api('purchase.list'),
  ]);

  if (storeRes && storeRes.store) {
    const rawCfg = storeRes.store.config || {};
    STORE_CFG = typeof rawCfg === 'string' ? JSON.parse(rawCfg) : rawCfg;
    document.getElementById('tb-store').textContent = (storeRes.store.name || 'Mi Tienda') + ' · Proveedores';
  }

  if (planRes && planRes.limits) {
    PLAN_INFO = planRes.limits;
  }

  ALL_SUPPLIERS = (supRes  && supRes.suppliers)  ? supRes.suppliers  : [];
  ALL_PURCHASES = (purchRes && purchRes.purchases) ? purchRes.purchases : [];

  updateStats();
  updateLimitBar();
  renderList();
}

/* ─── STATS ─── */
function updateStats() {
  const total   = ALL_SUPPLIERS.length;
  const conComp = new Set(ALL_PURCHASES.map(p => p.supplierId).filter(Boolean)).size;
  document.getElementById('s-total').textContent   = total;
  document.getElementById('s-activos').textContent = conComp;
  const max = PLAN_INFO.maxProveedores || 0;
  document.getElementById('s-limite').textContent  = max > 0 && max < 9999 ? max : '∞';
}

function updateLimitBar() {
  const bar = document.getElementById('limit-bar');
  const max = PLAN_INFO.maxProveedores || 0;
  if (!max || max === 0 || max >= 9999) { bar.classList.remove('show'); return; }
  const used  = ALL_SUPPLIERS.length;
  const pct   = Math.min(100, Math.round((used / max) * 100));
  const color = pct >= 100 ? '#ef4444' : pct >= 80 ? '#f59e0b' : '#059669';
  document.getElementById('limit-txt').textContent       = used + ' / ' + max + ' proveedores';
  document.getElementById('limit-fill').style.width      = pct + '%';
  document.getElementById('limit-fill').style.background = color;
  bar.classList.add('show');
  document.getElementById('btn-nuevo').disabled = pct >= 100;
}

/* ─── RENDER LISTA ─── */
function renderList() {
  const q    = (document.getElementById('search-input').value || '').toLowerCase();
  const list = q
    ? ALL_SUPPLIERS.filter(s =>
        (s.name    || '').toLowerCase().includes(q) ||
        (s.contact || '').toLowerCase().includes(q) ||
        (s.phone   || '').toLowerCase().includes(q) ||
        (s.email   || '').toLowerCase().includes(q)
      )
    : ALL_SUPPLIERS;

  const wrap = document.getElementById('sup-list');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-ico">🏭</div><h3>' +
      (q ? 'Sin resultados' : 'Sin proveedores') + '</h3><p>' +
      (q ? 'Prueba otra búsqueda' : 'Agrega tu primer proveedor con el botón + Nuevo') +
      '</p></div>';
    return;
  }

  wrap.innerHTML = '<div class="sup-list">' + list.map(function(s) {
    const letra   = (s.name || '?')[0].toUpperCase();
    const compras = ALL_PURCHASES.filter(function(p){ return p.supplierId === s.supplierId; }).length;
    const phone   = s.phone ? '<span class="sup-tag">📞 ' + esc(s.phone) + '</span>' : '';
    const email   = s.email ? '<span class="sup-tag">✉️ ' + esc(s.email) + '</span>' : '';
    const addr    = s.address ? '<span class="sup-tag">📍 ' + esc(s.address) + '</span>' : '';
    const ncomp   = '<span class="sup-tag">📦 ' + compras + ' compras</span>';
    return '<div class="sup-card" onclick="openDetail(\'' + esc(s.supplierId) + '\')">' +
      '<div class="sup-card-top">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<div class="sup-avatar">' + esc(letra) + '</div>' +
          '<div>' +
            '<div class="sup-name">' + esc(s.name) + '</div>' +
            '<div class="sup-contact">' + esc(s.contact || '') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sup-actions" onclick="event.stopPropagation()">' +
          (s.phone ? '<button class="btn btn-wa btn-sm" onclick="waSupplier(\'' + esc(s.supplierId) + '\')">WA</button>' : '') +
          '<button class="btn btn-ghost btn-sm" onclick="openEdit(\'' + esc(s.supplierId) + '\')">✏️</button>' +
        '</div>' +
      '</div>' +
      '<div class="sup-meta">' + phone + email + addr + ncomp + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ─── DETALLE ─── */
function openDetail(supplierId) {
  const s = ALL_SUPPLIERS.find(function(x){ return x.supplierId === supplierId; });
  if (!s) return;

  document.getElementById('detail-title').textContent = s.name;
  const compras = ALL_PURCHASES.filter(function(p){ return p.supplierId === supplierId; });
  const totalGastado = compras
    .filter(function(p){ return p.status === 'confirmed'; })
    .reduce(function(sum, p){ return sum + Number(p.total || 0); }, 0);

  const comprasList = compras.length
    ? compras.slice(0,10).map(function(p) {
        const fecha = p.createdAt ? new Date(p.createdAt).toLocaleDateString('es-MX') : '—';
        return '<div class="compra-row">' +
          '<div>' +
            '<div style="font-size:12px;font-family:var(--mono)">' + esc(p.purchaseId) + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">' + fecha + '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<span class="badge badge-' + (p.status||'pending') + '">' + labelStatus(p.status) + '</span>' +
            '<span style="font-weight:700;font-size:13px">' + fmt(p.total) + '</span>' +
          '</div>' +
        '</div>';
      }).join('')
    : '<div style="color:var(--muted);font-size:13px;padding:8px 0">Sin compras registradas</div>';

  document.getElementById('detail-body').innerHTML =
    '<div class="detail-grid">' +
      di('Nombre',    s.name    || '—') +
      di('Contacto',  s.contact || '—') +
      di('Teléfono',  s.phone   || '—') +
      di('Email',     s.email   || '—') +
      '<div class="dv-full">' + di('Dirección', s.address || '—') + '</div>' +
      '<div class="dv-full">' + di('Notas',     s.notes   || '—') + '</div>' +
    '</div>' +
    '<div style="margin-bottom:8px;font-size:13px;font-weight:700;color:var(--ok)">Total gastado: ' + fmt(totalGastado) + '</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">HISTORIAL DE COMPRAS</div>' +
    '<div class="compras-list">' + comprasList + '</div>';

  document.getElementById('detail-foot').innerHTML =
    (s.phone ? '<button class="btn btn-wa btn-full" onclick="waSupplier(\'' + esc(s.supplierId) + '\')">📱 WhatsApp</button>' : '') +
    '<button class="btn btn-ghost btn-full" onclick="openEdit(\'' + esc(s.supplierId) + '\');closeOverlay(\'overlay-detail\')">✏️ Editar</button>' +
    '<button class="btn btn-danger btn-full" onclick="deleteSupplier(\'' + esc(s.supplierId) + '\')">🗑 Eliminar</button>';

  openOverlay('overlay-detail');
}

/* ─── NUEVO / EDITAR ─── */
function openNew() {
  document.getElementById('form-title').textContent = 'Nuevo proveedor';
  document.getElementById('edit-id').value = '';
  ['f-name','f-contact','f-phone','f-email','f-address','f-notes'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  openOverlay('overlay-form');
  setTimeout(function(){ document.getElementById('f-name').focus(); }, 200);
}

function openEdit(supplierId) {
  const s = ALL_SUPPLIERS.find(function(x){ return x.supplierId === supplierId; });
  if (!s) return;
  document.getElementById('form-title').textContent = 'Editar proveedor';
  document.getElementById('edit-id').value    = supplierId;
  document.getElementById('f-name').value     = s.name    || '';
  document.getElementById('f-contact').value  = s.contact || '';
  document.getElementById('f-phone').value    = s.phone   || '';
  document.getElementById('f-email').value    = s.email   || '';
  document.getElementById('f-address').value  = s.address || '';
  document.getElementById('f-notes').value    = s.notes   || '';
  openOverlay('overlay-form');
}

async function saveSupplier() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('El nombre es requerido', 'error'); return; }
  const editId = document.getElementById('edit-id').value;

  // Verificar límite antes de crear
  if (!editId && PLAN_INFO.maxProveedores > 0 && PLAN_INFO.maxProveedores < 9999) {
    if (ALL_SUPPLIERS.length >= PLAN_INFO.maxProveedores) {
      toast('Límite de ' + PLAN_INFO.maxProveedores + ' proveedores alcanzado para tu plan.', 'error');
      return;
    }
  }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const data = {
    name,
    contact: document.getElementById('f-contact').value.trim(),
    phone:   document.getElementById('f-phone').value.trim(),
    email:   document.getElementById('f-email').value.trim(),
    address: document.getElementById('f-address').value.trim(),
    notes:   document.getElementById('f-notes').value.trim(),
  };

  const res = editId
    ? await api('supplier.update', Object.assign({ supplierId: editId }, data))
    : await api('supplier.create', data);

  btn.disabled = false; btn.textContent = 'Guardar';
  if (!res) return;
  toast(editId ? 'Proveedor actualizado ✅' : 'Proveedor creado ✅', 'success');
  closeOverlay('overlay-form');
  await loadAll();
}

async function deleteSupplier(supplierId) {
  const s    = ALL_SUPPLIERS.find(function(x){ return x.supplierId === supplierId; });
  const tieneCompras = ALL_PURCHASES.some(function(p){ return p.supplierId === supplierId; });
  const ok   = await showConfirm(
    '🗑',
    'Eliminar proveedor',
    '¿Eliminar "' + esc(s ? s.name : supplierId) + '"?' +
    (tieneCompras ? '\n\nEste proveedor tiene compras registradas. El historial se conservará.' : ''),
    'Eliminar', true
  );
  if (!ok) return;
  const res = await api('supplier.delete', { supplierId });
  if (!res) return;
  toast('Proveedor eliminado', 'warn');
  closeOverlay('overlay-detail');
  await loadAll();
}

/* ─── WHATSAPP ─── */
function waSupplier(supplierId) {
  const s = ALL_SUPPLIERS.find(function(x){ return x.supplierId === supplierId; });
  if (!s || !s.phone) return;
  const phone = s.phone.replace(/\D/g, '');
  const msg   = 'Hola ' + (s.contact || s.name) + ', te contactamos de parte de nuestra tienda.';
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
}

/* ─── OVERLAYS ─── */
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click', function(e){ if (e.target === o) o.classList.remove('open'); });
});

/* ─── CONFIRM ─── */
function showConfirm(icon, title, msg, okLabel, isDanger) {
  return new Promise(function(resolve) {
    document.getElementById('c-icon').textContent  = icon    || '⚠️';
    document.getElementById('c-title').textContent = title   || '¿Estás seguro?';
    document.getElementById('c-msg').textContent   = msg     || '';
    document.getElementById('c-ok').textContent    = okLabel || 'Confirmar';
    document.getElementById('c-ok').className      = isDanger ? 'btn btn-danger btn-full' : 'btn btn-primary btn-full';
    _confirmResolve = resolve;
    document.getElementById('confirm-overlay').classList.add('open');
  });
}
function resolveConfirm(val) {
  document.getElementById('confirm-overlay').classList.remove('open');
  if (_confirmResolve) { _confirmResolve(val); _confirmResolve = null; }
}
function confirmLogout() {
  showConfirm('↩','Cerrar sesión','¿Seguro que quieres salir?','Salir', true)
    .then(function(ok){ if (ok) logout(); });
}

/* ─── SESIÓN ─── */
let _inactWarn = null, _inactLogout = null;
function resetInactTimer() {
  clearTimeout(_inactWarn); clearTimeout(_inactLogout);
  document.getElementById('session-warn').classList.remove('show');
  _inactWarn = setTimeout(function() {
    document.getElementById('session-warn').classList.add('show');
    _inactLogout = setTimeout(logout, 2*60*1000);
  }, 28*60*1000);
}
function extendSession() { resetInactTimer(); toast('Sesión extendida ✅', 'success'); }
['click','touchstart','keypress','scroll'].forEach(function(e){
  document.addEventListener(e, resetInactTimer, true);
});
function logout() {
  ['ld_token','ld_store','ld_role','ld_backend','ld_inv_backend','ld_plan_info'].forEach(function(k){
    localStorage.removeItem(k);
  });
  location.reload();
}

/* ─── UTILS ─── */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(n) {
  const cur = STORE_CFG.currency || 'MXN';
  return new Intl.NumberFormat('es-MX',{style:'currency',currency:cur}).format(Number(n||0));
}
function labelStatus(s) {
  return {pending:'Pendiente',confirmed:'Confirmada',cancelled:'Cancelada'}[s] || s;
}
function di(label, val) {
  return '<div><div class="dl">' + label + '</div><div class="dv">' + val + '</div></div>';
}
function toast(msg, type) {
  type = type || 'success';
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = type; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(function(){ el.style.display = 'none'; }, 3500);
}

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) loadAll();
});

/* ── VOLVER AL PANEL + MONITOR DE INACTIVIDAD ── */
function goBackPanel() {
  var backend = localStorage.getItem('ld_backend') || '';
  var store   = localStorage.getItem('ld_store')   || '';
  var base    = window.location.href.split('?')[0].replace(/[^\/]+$/, '');
  var url     = base + 'index.html';
  if (backend) url += '?backend=' + encodeURIComponent(backend);
  if (store)   url += (backend ? '&' : '?') + 'store=' + encodeURIComponent(store);
  window.location.href = url;
}
var _modIdleWarn=null, _modIdleClose=null, _modCloseCount=null;
function resetModIdle() {
  clearTimeout(_modIdleWarn); clearTimeout(_modIdleClose); clearInterval(_modCloseCount);
  var w = document.getElementById('mod-inactive-warn');
  if (w) w.classList.remove('show');
  _modIdleWarn = setTimeout(function() {
    if (w) w.classList.add('show');
    var secs = 60;
    var el = document.getElementById('mod-inactive-secs');
    if (el) el.textContent = secs;
    _modCloseCount = setInterval(function() {
      secs--;
      if (el) el.textContent = secs;
      if (secs <= 0) { clearInterval(_modCloseCount); goBackPanel(); }
    }, 1000);
    _modIdleClose = setTimeout(goBackPanel, 60000);
  }, 10 * 60 * 1000);
}
function extendModSession() { resetModIdle(); }
['click','touchstart','keypress','scroll','mousemove'].forEach(function(ev) {
  document.addEventListener(ev, resetModIdle, { passive: true });
});
resetModIdle();

</script>
</body>
